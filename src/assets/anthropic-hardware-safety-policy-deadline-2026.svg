<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Independent safety controls for AI-operated hardware</title>
<desc id="desc">A diagram showing an AI command path separated from a human emergency stop and independent machine safety controller.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#16324f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".3"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1320" cy="170" r="210" fill="#38bdf8" opacity=".08"/><circle cx="260" cy="760" r="250" fill="#22c55e" opacity=".06"/>
<text x="120" y="135" fill="#f8fafc" font-family="Arial, sans-serif" font-size="54" font-weight="700">AI hardware needs an independent stop path</text>
<text x="120" y="195" fill="#b9c9da" font-family="Arial, sans-serif" font-size="28">Model command ≠ machine safety control</text>
<g filter="url(#shadow)"><rect x="120" y="300" width="340" height="190" rx="28" fill="#12263d" stroke="#38bdf8" stroke-width="3"/><text x="290" y="375" text-anchor="middle" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">AI MODEL</text><text x="290" y="425" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="24">proposes action</text></g>
<path d="M460 395H650" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round"/><path d="M630 375l30 20-30 20" fill="none" stroke="#7dd3fc" stroke-width="8"/>
<g filter="url(#shadow)"><rect x="660" y="300" width="360" height="190" rx="28" fill="#132d35" stroke="#22c55e" stroke-width="3"/><text x="840" y="365" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="30" font-weight="700">SAFETY CONTROLLER</text><text x="840" y="415" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="23">hard limits + safe state</text><text x="840" y="452" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="20">independent of model output</text></g>
<path d="M1020 395H1185" stroke="#86efac" stroke-width="8" stroke-linecap="round"/><path d="M1165 375l30 20-30 20" fill="none" stroke="#86efac" stroke-width="8"/>
<g filter="url(#shadow)"><rect x="1195" y="300" width="285" height="190" rx="28" fill="#2b2433" stroke="#fbbf24" stroke-width="3"/><text x="1337" y="375" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="30" font-weight="700">MACHINE</text><text x="1337" y="425" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="23">bounded action</text></g>
<g filter="url(#shadow)"><rect x="570" y="610" width="540" height="150" rx="75" fill="#3b1118" stroke="#fb7185" stroke-width="4"/><circle cx="670" cy="685" r="48" fill="#e11d48"/><rect x="647" y="660" width="46" height="50" rx="8" fill="#fff1f2"/><text x="870" y="675" text-anchor="middle" fill="#fecdd3" font-family="Arial, sans-serif" font-size="31" font-weight="700">HUMAN STOP CONTROL</text><text x="870" y="717" text-anchor="middle" fill="#fda4af" font-family="Arial, sans-serif" font-size="21">observable • immediate • tested</text></g>
<path d="M840 610V500" stroke="#fb7185" stroke-width="7" stroke-dasharray="16 14"/><path d="M820 525l20-30 20 30" fill="none" stroke="#fb7185" stroke-width="7"/>
</svg>