<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Signed shield protecting a Linux server during patch rollout</title>
  <desc id="desc">A dark blue infrastructure diagram with a green signed shield in front of a running server and a gold patch moving through a validation gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#12365a"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5fe0b4"/><stop offset="1" stop-color="#168f78"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020812" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".15" stroke="#8fc5ef" stroke-width="2"><path d="M0 180h1600M0 360h1600M0 540h1600M0 720h1600"/><path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/></g>
  <text x="120" y="138" fill="#dceeff" font-family="Arial, sans-serif" font-size="54" font-weight="700">PATCH WINDOW</text>
  <text x="120" y="198" fill="#8fb5d4" font-family="Arial, sans-serif" font-size="29">Temporary protection • explicit approval • permanent fix still required</text>
  <g filter="url(#shadow)">
    <rect x="1010" y="270" width="390" height="380" rx="34" fill="#112b46" stroke="#4b83ad" stroke-width="4"/>
    <rect x="1060" y="325" width="290" height="72" rx="14" fill="#0b1d30" stroke="#3d6f96" stroke-width="3"/>
    <rect x="1060" y="425" width="290" height="72" rx="14" fill="#0b1d30" stroke="#3d6f96" stroke-width="3"/>
    <rect x="1060" y="525" width="290" height="72" rx="14" fill="#0b1d30" stroke="#3d6f96" stroke-width="3"/>
    <circle cx="1306" cy="361" r="10" fill="#5fe0b4"/><circle cx="1306" cy="461" r="10" fill="#5fe0b4"/><circle cx="1306" cy="561" r="10" fill="#5fe0b4"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M710 242L916 320v176c0 139-91 238-206 282-115-44-206-143-206-282V320z" fill="url(#shield)" stroke="#b8ffe7" stroke-width="7"/>
    <path d="M620 485l58 58 126-142" fill="none" stroke="#062a28" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="640" y="637" width="140" height="58" rx="29" fill="#062a28"/>
    <text x="710" y="676" text-anchor="middle" fill="#d8fff3" font-family="Arial, sans-serif" font-size="25" font-weight="700">SIGNED</text>
  </g>
  <g>
    <path d="M236 470h190" stroke="#f1bd59" stroke-width="10" stroke-linecap="round"/>
    <path d="M395 438l48 32-48 32" fill="none" stroke="#f1bd59" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="154" y="386" width="176" height="168" rx="24" fill="#2d3440" stroke="#f1bd59" stroke-width="5"/>
    <path d="M190 430h104M190 470h104M190 510h72" stroke="#f7d99c" stroke-width="13" stroke-linecap="round"/>
    <text x="242" y="600" text-anchor="middle" fill="#f7d99c" font-family="Arial, sans-serif" font-size="27" font-weight="700">PATCH</text>
  </g>
  <text x="800" y="840" text-anchor="middle" fill="#b6cfe3" font-family="Arial, sans-serif" font-size="25">A shield buys time. It does not close the patch cycle.</text>
</svg>