<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI capacity depends on network paths</title>
  <desc id="desc">Two cloud data centers are joined by primary and failover fiber routes, with checkpoints for route, region, and recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#17364f"/></linearGradient>
    <linearGradient id="fiber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3dd9ff"/><stop offset="1" stop-color="#61f2bd"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="220" cy="760" r="280" fill="#0e9b82" opacity=".12"/><circle cx="1390" cy="120" r="260" fill="#1d6b88" opacity=".16"/>
  <text x="120" y="145" fill="#eaf8ff" font-family="Arial, sans-serif" font-size="61" font-weight="700">AI CAPACITY NEEDS A PATH.</text>
  <text x="120" y="213" fill="#8fdcf0" font-family="Arial, sans-serif" font-size="33">Compute, region, and fiber fail together.</text>
  <g fill="#0b2235" stroke="#50e3d0" stroke-width="4">
    <rect x="125" y="345" width="340" height="260" rx="34"/><rect x="1135" y="345" width="340" height="260" rx="34"/>
  </g>
  <g fill="#ecfbff" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="295" y="445" font-size="34" font-weight="700">DATA + APPS</text><text x="295" y="500" font-size="27" fill="#8fdcf0">ENTERPRISE</text>
    <text x="1305" y="445" font-size="34" font-weight="700">AI CAPACITY</text><text x="1305" y="500" font-size="27" fill="#8fdcf0">CLOUD REGION</text>
  </g>
  <path d="M465 425 C690 300 910 300 1135 425" fill="none" stroke="url(#fiber)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M465 535 C690 690 910 690 1135 535" fill="none" stroke="#f8d66d" stroke-width="8" stroke-linecap="round" stroke-dasharray="24 20"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700">
    <text x="800" y="330" fill="#62eec8" font-size="26">PRIMARY ROUTE</text><text x="800" y="700" fill="#f7e9ad" font-size="26">TESTED FAILOVER?</text>
  </g>
  <g fill="#102a39" stroke="#43dfff" stroke-width="3"><circle cx="650" cy="350" r="34"/><circle cx="950" cy="350" r="34"/></g>
  <g fill="#dff9ff" font-family="Arial, sans-serif" font-size="19" text-anchor="middle"><text x="650" y="357">PATH</text><text x="950" y="357">REGION</text></g>
  <text x="120" y="800" fill="#9eb7c7" font-family="Arial, sans-serif" font-size="26">MAP THE ROUTE  •  VERIFY DIVERSITY  •  TEST RECOVERY</text>
</svg>