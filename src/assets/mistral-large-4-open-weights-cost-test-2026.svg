<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mistral Large 4 deployment cost and control comparison</title>
  <desc id="desc">Three paths from an open-weight model to managed API, private endpoint, and self-hosting, compared by cost, control, and operating burden.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10162b"/><stop offset="1" stop-color="#2c2142"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5b"/><stop offset="1" stop-color="#d94779"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="90" r="260" fill="#ff8a5b" opacity=".08"/>
  <circle cx="140" cy="820" r="300" fill="#62d6c5" opacity=".07"/>
  <text x="110" y="130" fill="#f7f3ed" font-family="Arial, sans-serif" font-size="54" font-weight="700">OPEN WEIGHTS, THREE COST PATHS</text>
  <text x="112" y="182" fill="#bfc8df" font-family="Arial, sans-serif" font-size="25">Compare total operating cost and control—not access alone.</text>
  <g filter="url(#shadow)">
    <rect x="110" y="285" width="320" height="330" rx="30" fill="url(#model)"/>
    <rect x="545" y="245" width="285" height="410" rx="26" fill="#f5f1ea"/>
    <rect x="915" y="245" width="285" height="410" rx="26" fill="#f5f1ea"/>
    <rect x="1285" y="245" width="250" height="410" rx="26" fill="#f5f1ea"/>
  </g>
  <text x="160" y="385" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="700">MISTRAL</text>
  <text x="160" y="430" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="700">LARGE 4</text>
  <text x="160" y="510" fill="#ffe6dc" font-family="Arial, sans-serif" font-size="22">Open weights</text>
  <text x="160" y="548" fill="#ffe6dc" font-family="Arial, sans-serif" font-size="22">Customizable</text>
  <path d="M430 450 H520" stroke="#62d6c5" stroke-width="10"/><path d="M505 430l25 20-25 20" fill="none" stroke="#62d6c5" stroke-width="10"/>
  <path d="M830 450 H890" stroke="#62d6c5" stroke-width="10"/><path d="M875 430l25 20-25 20" fill="none" stroke="#62d6c5" stroke-width="10"/>
  <path d="M1200 450 H1260" stroke="#62d6c5" stroke-width="10"/><path d="M1245 430l25 20-25 20" fill="none" stroke="#62d6c5" stroke-width="10"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="688" y="330" fill="#202943" font-size="29" font-weight="700">MANAGED API</text>
    <text x="688" y="408" fill="#506078" font-size="21">Lower operations</text><text x="688" y="447" fill="#506078" font-size="21">Less control</text><text x="688" y="540" fill="#d2556d" font-size="24" font-weight="700">Measure outcomes</text>
    <text x="1058" y="330" fill="#202943" font-size="29" font-weight="700">PRIVATE</text><text x="1058" y="366" fill="#202943" font-size="29" font-weight="700">ENDPOINT</text>
    <text x="1058" y="430" fill="#506078" font-size="21">Shared burden</text><text x="1058" y="469" fill="#506078" font-size="21">More isolation</text><text x="1058" y="540" fill="#d2556d" font-size="24" font-weight="700">Count controls</text>
    <text x="1410" y="330" fill="#202943" font-size="29" font-weight="700">SELF-HOST</text>
    <text x="1410" y="408" fill="#506078" font-size="21">More control</text><text x="1410" y="447" fill="#506078" font-size="21">More burden</text><text x="1410" y="540" fill="#d2556d" font-size="24" font-weight="700">Price ownership</text>
  </g>
  <text x="800" y="770" fill="#f7f3ed" font-family="Arial, sans-serif" font-size="35" font-weight="700" text-anchor="middle">TOTAL COST PER ACCEPTED OUTPUT</text>
</svg>