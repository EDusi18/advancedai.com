<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Snapshot safety for agent runtimes</title>
<desc id="desc">A shared initialized snapshot restores isolated AI agent sessions while fresh credentials, identifiers, and time enter after restore.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#1e293b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".34"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1400" cy="120" r="250" fill="#f59e0b" opacity=".07"/><circle cx="180" cy="800" r="280" fill="#38bdf8" opacity=".06"/>
<text x="105" y="120" fill="#f8fafc" font-family="Arial, sans-serif" font-size="54" font-weight="700">A faster runtime changes startup state</text>
<text x="105" y="181" fill="#b9c9da" font-family="Arial, sans-serif" font-size="28">Test what belongs in the snapshot—and what must stay fresh</text>
<g filter="url(#shadow)"><rect x="120" y="315" width="390" height="250" rx="30" fill="#172554" stroke="#60a5fa" stroke-width="4"/><text x="315" y="385" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="31" font-weight="700">INITIALIZED SNAPSHOT</text><text x="315" y="444" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="23">model files • config</text><text x="315" y="487" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="23">reusable clients • warm state</text><text x="315" y="530" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="20">created once per version</text></g>
<path d="M510 440H705" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/><path d="M675 416l38 24-38 24" fill="none" stroke="#60a5fa" stroke-width="8"/>
<g filter="url(#shadow)"><rect x="720" y="280" width="360" height="320" rx="36" fill="#12332d" stroke="#34d399" stroke-width="4"/><text x="900" y="355" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="31" font-weight="700">RESTORED SESSION</text><rect x="790" y="395" width="220" height="145" rx="22" fill="#0f2430" stroke="#6ee7b7" stroke-width="3"/><text x="900" y="450" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="24">isolated microVM</text><text x="900" y="495" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="21">per session</text><text x="900" y="570" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="19">restore, then refresh</text></g>
<path d="M1080 440H1245" stroke="#34d399" stroke-width="8" stroke-linecap="round"/><path d="M1215 416l38 24-38 24" fill="none" stroke="#34d399" stroke-width="8"/>
<g filter="url(#shadow)"><rect x="1260" y="315" width="240" height="250" rx="30" fill="#3a2715" stroke="#fbbf24" stroke-width="4"/><text x="1380" y="385" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="28" font-weight="700">REQUEST</text><text x="1380" y="438" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="20">fresh ID</text><text x="1380" y="478" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="20">fresh time</text><text x="1380" y="518" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="20">valid credentials</text></g>
<g filter="url(#shadow)"><rect x="350" y="685" width="900" height="105" rx="26" fill="#281b35" stroke="#c084fc" stroke-width="3"/><text x="800" y="730" text-anchor="middle" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">V1 ↔ V2 TEST</text><text x="800" y="766" text-anchor="middle" fill="#d8b4fe" font-family="Arial, sans-serif" font-size="20">uniqueness • credentials • tools • latency • cost per accepted output</text></g>
</svg>