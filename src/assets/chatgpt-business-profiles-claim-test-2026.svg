<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Claiming a ChatGPT business profile is the start of a test</title>
<desc id="desc">A verified business profile connects to aggregate insights and an optional agent, while a boundary states that a claim does not guarantee recommendation.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071521"/><stop offset="1" stop-color="#17304a"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12283a"/><stop offset="1" stop-color="#183c4a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".3"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1370" cy="120" r="260" fill="#2dd4bf" opacity=".07"/><circle cx="150" cy="820" r="280" fill="#60a5fa" opacity=".06"/>
<text x="105" y="120" fill="#f8fafc" font-family="Arial, sans-serif" font-size="54" font-weight="700">Your business can now claim its ChatGPT profile</text>
<text x="105" y="183" fill="#b9c9da" font-family="Arial, sans-serif" font-size="28">Treat it as a measured distribution test—not guaranteed visibility</text>
<g filter="url(#shadow)"><rect x="105" y="295" width="390" height="300" rx="32" fill="url(#card)" stroke="#2dd4bf" stroke-width="4"/><circle cx="195" cy="390" r="48" fill="#0f766e"/><path d="M171 391l17 17 34-42" fill="none" stroke="#ccfbf1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="378" text-anchor="middle" fill="#99f6e4" font-family="Arial, sans-serif" font-size="31" font-weight="700">CLAIM</text><text x="300" y="430" text-anchor="middle" fill="#e2f7f4" font-family="Arial, sans-serif" font-size="23">verify ownership</text><text x="300" y="475" text-anchor="middle" fill="#e2f7f4" font-family="Arial, sans-serif" font-size="23">correct facts</text><text x="300" y="520" text-anchor="middle" fill="#e2f7f4" font-family="Arial, sans-serif" font-size="23">connect product feed</text></g>
<path d="M495 445H605" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round"/><path d="M578 421l36 24-36 24" fill="none" stroke="#7dd3fc" stroke-width="8"/>
<g filter="url(#shadow)"><rect x="615" y="295" width="390" height="300" rx="32" fill="#172554" stroke="#60a5fa" stroke-width="4"/><path d="M700 505V430M770 505V390M840 505V455M910 505V350" stroke="#93c5fd" stroke-width="22" stroke-linecap="round"/><text x="810" y="370" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="31" font-weight="700">MEASURE</text><text x="810" y="550" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="22">mentions • clicks • topics</text></g>
<path d="M1005 445H1115" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/><path d="M1088 421l36 24-36 24" fill="none" stroke="#c4b5fd" stroke-width="8"/>
<g filter="url(#shadow)"><rect x="1125" y="295" width="370" height="300" rx="32" fill="#2e2450" stroke="#a78bfa" stroke-width="4"/><rect x="1200" y="365" width="220" height="120" rx="28" fill="#4c1d95"/><circle cx="1250" cy="425" r="22" fill="#ddd6fe"/><path d="M1290 405h80M1290 445h55" stroke="#ddd6fe" stroke-width="10" stroke-linecap="round"/><text x="1310" y="540" text-anchor="middle" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">OPTIONAL AGENT</text></g>
<g filter="url(#shadow)"><rect x="320" y="690" width="960" height="105" rx="52" fill="#3a1d24" stroke="#fb7185" stroke-width="3"/><text x="800" y="757" text-anchor="middle" fill="#fecdd3" font-family="Arial, sans-serif" font-size="32" font-weight="700">CLAIMED ≠ RECOMMENDED ≠ CONVERTED</text></g>
</svg>