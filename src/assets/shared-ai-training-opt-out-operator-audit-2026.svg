<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shared AI training preference control</title>
  <desc id="desc">One website policy signal branches toward multiple AI providers while an audit checklist remains active.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10182f"/><stop offset="1" stop-color="#272447"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63d7c6"/><stop offset="1" stop-color="#4e8fd8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="280" fill="#63d7c6" opacity=".08"/>
  <circle cx="90" cy="850" r="300" fill="#ff8a65" opacity=".07"/>
  <text x="110" y="130" fill="#f7f3ed" font-family="Arial, sans-serif" font-size="52" font-weight="700">ONE SIGNAL, MULTIPLE PROVIDERS</text>
  <text x="112" y="182" fill="#bec9df" font-family="Arial, sans-serif" font-size="25">Prepare the control—keep current rules until implementation is proven.</text>
  <g filter="url(#shadow)">
    <rect x="110" y="290" width="450" height="330" rx="30" fill="url(#signal)"/>
    <rect x="900" y="245" width="280" height="150" rx="26" fill="#f5f1ea"/>
    <rect x="900" y="450" width="280" height="150" rx="26" fill="#f5f1ea"/>
    <rect x="1240" y="345" width="250" height="150" rx="26" fill="#f5f1ea"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="335" y="375" text-anchor="middle" fill="white" font-size="31" font-weight="700">WEBSITE POLICY</text>
    <text x="335" y="445" text-anchor="middle" fill="#e8ffff" font-size="24">__usage_ai-training</text>
    <text x="335" y="500" text-anchor="middle" fill="#e8ffff" font-size="22">Paths · exceptions · owner</text>
    <text x="1040" y="335" text-anchor="middle" fill="#202943" font-size="28" font-weight="700">PROVIDER A</text>
    <text x="1040" y="540" text-anchor="middle" fill="#202943" font-size="28" font-weight="700">PROVIDER B</text>
    <text x="1365" y="435" text-anchor="middle" fill="#202943" font-size="28" font-weight="700">PROVIDER C</text>
  </g>
  <g stroke="#ffb16f" stroke-width="9" fill="none"><path d="M560 455H740V320H875"/><path d="M560 455H875"/><path d="M560 455H740V520H875"/><path d="M1180 320h60"/><path d="M1215 300l25 20-25 20"/></g>
  <rect x="515" y="690" width="570" height="92" rx="46" fill="#ff8a65"/>
  <text x="800" y="748" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="31" font-weight="700">AUDIT BEFORE YOU SWITCH</text>
</svg>