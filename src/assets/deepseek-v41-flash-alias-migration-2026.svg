<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI model alias migration and validation checklist</title>
<desc id="desc">A glowing route moves from an old model alias to a new version beside a checklist, suggesting controlled model upgrades.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#102b4f"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36d9ff"/><stop offset="1" stop-color="#6cf5c2"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><g opacity=".14" stroke="#62dfff"><path d="M0 180h1600M0 360h1600M0 540h1600M0 720h1600M320 0v900M640 0v900M960 0v900M1280 0v900"/></g>
<rect x="170" y="280" width="390" height="250" rx="28" fill="#0b2342" stroke="#3a789c" stroke-width="3"/><text x="365" y="370" text-anchor="middle" fill="#a9c9dc" font-family="Arial,sans-serif" font-size="34">FLOATING ALIAS</text><text x="365" y="445" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">deepseek-flash</text>
<path d="M575 405h330" stroke="url(#cyan)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/><path d="M855 355l70 50-70 50" fill="none" stroke="#6cf5c2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="945" y="220" width="470" height="370" rx="28" fill="#0b2342" stroke="#45d9d0" stroke-width="3"/><text x="1180" y="305" text-anchor="middle" fill="#6cf5c2" font-family="Arial,sans-serif" font-size="34" font-weight="700">VERSION CHECK</text><g fill="none" stroke="#6cf5c2" stroke-width="8"><path d="M1035 365l18 18 36-42M1035 435l18 18 36-42M1035 505l18 18 36-42"/></g><g fill="#d9eff8" font-family="Arial,sans-serif" font-size="31"><text x="1120" y="385">Accepted output</text><text x="1120" y="455">Tool behavior</text><text x="1120" y="525">Latency + cost</text></g>
<text x="800" y="735" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="54" font-weight="700">A STABLE NAME CAN HIDE A MODEL CHANGE</text><text x="800" y="795" text-anchor="middle" fill="#8ccfe7" font-family="Arial,sans-serif" font-size="30">Test, log, and promote model versions deliberately</text></svg>