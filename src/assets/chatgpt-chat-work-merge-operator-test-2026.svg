<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT workspace lanes merging with controls intact</title>
  <desc id="desc">Two workflow lanes labeled Chat and Work converge toward a shared execution area, with permission, audit, and usage controls shown below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071728"/><stop offset="1" stop-color="#123b4c"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ee7d8"/><stop offset="1" stop-color="#a8f0c8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="130" r="250" fill="#1f6a75" opacity=".22"/>
  <circle cx="180" cy="820" r="300" fill="#0c887c" opacity=".14"/>
  <text x="120" y="130" fill="#f4fbfb" font-family="Arial, sans-serif" font-size="54" font-weight="700">One interface. Three controls to verify.</text>
  <text x="122" y="182" fill="#a9c7cd" font-family="Arial, sans-serif" font-size="26">Permissions • Audit trail • Shared usage</text>
  <g filter="url(#shadow)">
    <rect x="120" y="255" width="390" height="210" rx="28" fill="#102c3b" stroke="#4f8190" stroke-width="2"/>
    <text x="315" y="345" text-anchor="middle" fill="#e8f7f6" font-family="Arial, sans-serif" font-size="40" font-weight="700">CHAT</text>
    <text x="315" y="395" text-anchor="middle" fill="#94b9c0" font-family="Arial, sans-serif" font-size="23">Explore and decide</text>
    <rect x="120" y="530" width="390" height="210" rx="28" fill="#102c3b" stroke="#4f8190" stroke-width="2"/>
    <text x="315" y="620" text-anchor="middle" fill="#e8f7f6" font-family="Arial, sans-serif" font-size="40" font-weight="700">WORK</text>
    <text x="315" y="670" text-anchor="middle" fill="#94b9c0" font-family="Arial, sans-serif" font-size="23">Execute and review</text>
    <path d="M510 360 C700 360 690 450 835 450" fill="none" stroke="url(#flow)" stroke-width="18" stroke-linecap="round"/>
    <path d="M510 635 C700 635 690 500 835 500" fill="none" stroke="url(#flow)" stroke-width="18" stroke-linecap="round"/>
    <rect x="835" y="335" width="645" height="295" rx="36" fill="#effaf8"/>
    <text x="1158" y="420" text-anchor="middle" fill="#12313a" font-family="Arial, sans-serif" font-size="42" font-weight="700">MERGED WORKSPACE</text>
    <text x="1158" y="478" text-anchor="middle" fill="#365b63" font-family="Arial, sans-serif" font-size="25">Conversation moves closer to execution</text>
    <g font-family="Arial, sans-serif" font-size="24" font-weight="700">
      <rect x="905" y="535" width="155" height="54" rx="27" fill="#d2efe9"/><text x="982" y="570" text-anchor="middle" fill="#134c4b">PERMISSIONS</text>
      <rect x="1080" y="535" width="155" height="54" rx="27" fill="#d2efe9"/><text x="1157" y="570" text-anchor="middle" fill="#134c4b">AUDIT</text>
      <rect x="1255" y="535" width="155" height="54" rx="27" fill="#d2efe9"/><text x="1332" y="570" text-anchor="middle" fill="#134c4b">USAGE</text>
    </g>
  </g>
  <text x="1480" y="820" text-anchor="end" fill="#7198a1" font-family="Arial, sans-serif" font-size="20">ADVANCEDAI.COM</text>
</svg>