<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Chat interface connected to controlled enterprise workflows</title><desc id="desc">A conversational AI panel connects through permission, approval, and audit gates to finance, procurement, and operations systems.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071427"/><stop offset="1" stop-color="#122a46"/></linearGradient><linearGradient id="chat" x2="1" y2="1"><stop stop-color="#1f4f71"/><stop offset="1" stop-color="#17334e"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1260" cy="135" r="260" fill="#0ea5a4" opacity=".08"/><circle cx="290" cy="790" r="320" fill="#5b8cff" opacity=".07"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="110" y="118" fill="#f3f7fb" font-size="50" font-weight="700">Business workflows inside chat</text><text x="112" y="168" fill="#9fb5cb" font-size="25">Convenience passes through permissions, approvals, and audit</text>
<rect x="110" y="235" width="510" height="500" rx="34" fill="url(#chat)" stroke="#4f82a8" stroke-width="3"/><circle cx="170" cy="300" r="20" fill="#49d6c6"/><rect x="208" y="278" width="300" height="46" rx="18" fill="#2b607f"/><rect x="160" y="370" width="400" height="82" rx="24" fill="#0d2138"/><text x="190" y="407" fill="#d8e7f2" font-size="22">Why did purchasing exceed plan?</text><text x="190" y="435" fill="#87a8c1" font-size="17">Review finance and procurement records</text><rect x="210" y="500" width="350" height="114" rx="24" fill="#225c72"/><text x="240" y="540" fill="#f3f7fb" font-size="21">Variance found</text><text x="240" y="572" fill="#c4d9e8" font-size="17">Proposed action requires approval</text><rect x="240" y="642" width="148" height="46" rx="23" fill="#19a79a"/><text x="280" y="672" fill="#041a20" font-size="18" font-weight="700">Review</text>
<path d="M620 480H765" stroke="#50d4c8" stroke-width="6"/>
<rect x="760" y="270" width="290" height="120" rx="26" fill="#142d45" stroke="#6f9dbb" stroke-width="3"/><text x="805" y="320" fill="#f1f6fa" font-size="24" font-weight="700">PERMISSIONS</text><text x="805" y="356" fill="#9fb8cb" font-size="18">Least privilege</text><rect x="760" y="420" width="290" height="120" rx="26" fill="#143a45" stroke="#4dd5c7" stroke-width="3"/><text x="812" y="470" fill="#f1f6fa" font-size="24" font-weight="700">APPROVAL</text><text x="805" y="506" fill="#a9d9d5" font-size="18">Consequence shown</text><rect x="760" y="570" width="290" height="120" rx="26" fill="#142d45" stroke="#6f9dbb" stroke-width="3"/><text x="848" y="620" fill="#f1f6fa" font-size="24" font-weight="700">AUDIT</text><text x="810" y="656" fill="#9fb8cb" font-size="18">Reconstruct and roll back</text>
<path d="M1050 330H1185M1050 480H1185M1050 630H1185" stroke="#4f82a8" stroke-width="5"/><rect x="1185" y="250" width="300" height="140" rx="28" fill="#11263b" stroke="#385b77" stroke-width="3"/><text x="1268" y="310" fill="#eef5fa" font-size="27" font-weight="700">FINANCE</text><text x="1250" y="348" fill="#8daac0" font-size="18">Read and reconcile</text><rect x="1185" y="410" width="300" height="140" rx="28" fill="#11263b" stroke="#385b77" stroke-width="3"/><text x="1233" y="470" fill="#eef5fa" font-size="27" font-weight="700">PROCUREMENT</text><text x="1245" y="508" fill="#8daac0" font-size="18">Review and approve</text><rect x="1185" y="570" width="300" height="140" rx="28" fill="#11263b" stroke="#385b77" stroke-width="3"/><text x="1241" y="630" fill="#eef5fa" font-size="27" font-weight="700">OPERATIONS</text><text x="1250" y="668" fill="#8daac0" font-size="18">Act and verify</text></g></svg>
