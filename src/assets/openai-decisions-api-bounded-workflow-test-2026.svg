<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded AI decisions with human review</title>
  <desc id="desc">Business requests flow through probability, choice, and score gates before reaching a human review checkpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#123a57"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3dd9ff"/><stop offset="1" stop-color="#61f2bd"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="130" r="250" fill="#1d6b88" opacity=".16"/>
  <circle cx="250" cy="770" r="310" fill="#0e9b82" opacity=".12"/>
  <text x="120" y="150" fill="#eaf8ff" font-family="Arial, sans-serif" font-size="62" font-weight="700">BOUND THE ANSWER.</text>
  <text x="120" y="218" fill="#8fdcf0" font-family="Arial, sans-serif" font-size="34">Measure the cost of being wrong.</text>
  <path d="M145 480 H1450" stroke="#35566a" stroke-width="18" stroke-linecap="round"/>
  <path d="M145 480 H1450" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(370 480)"><rect x="-125" y="-92" width="250" height="184" rx="28" fill="#0b2235" stroke="#42d9ff" stroke-width="4"/><text y="-10" fill="#ecfbff" font-size="32" font-weight="700">PROBABILITY</text><text y="40" fill="#86d7ea" font-size="25">0 → 1</text></g>
    <g transform="translate(700 480)"><rect x="-125" y="-92" width="250" height="184" rx="28" fill="#0b2235" stroke="#49e0d1" stroke-width="4"/><text y="-10" fill="#ecfbff" font-size="32" font-weight="700">CHOICE</text><text y="40" fill="#86d7ea" font-size="25">A / B / C</text></g>
    <g transform="translate(1030 480)"><rect x="-125" y="-92" width="250" height="184" rx="28" fill="#0b2235" stroke="#61f2bd" stroke-width="4"/><text y="-10" fill="#ecfbff" font-size="32" font-weight="700">SCORE</text><text y="40" fill="#86d7ea" font-size="25">RUBRIC</text></g>
    <g transform="translate(1380 480)"><circle r="104" fill="#102a39" stroke="#f8d66d" stroke-width="5"/><path d="M-31 6 l22 22 48-58" fill="none" stroke="#f8d66d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><text y="148" fill="#f7e9ad" font-size="25" font-weight="700">HUMAN REVIEW</text></g>
  </g>
  <g fill="#5ee9c2"><circle cx="145" cy="480" r="13"/><circle cx="206" cy="480" r="9"/><circle cx="1275" cy="480" r="10"/></g>
  <text x="120" y="790" fill="#9eb7c7" font-family="Arial, sans-serif" font-size="26">FAST ROUTING  •  EXPLICIT THRESHOLDS  •  REVERSIBLE AUTOMATION</text>
</svg>
