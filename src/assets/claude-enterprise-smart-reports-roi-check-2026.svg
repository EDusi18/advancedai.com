<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude enterprise ROI report with independent outcome check</title>
  <desc id="desc">A dark dashboard connects AI usage and spend charts to a separate checklist for accepted outputs, review effort, and business results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101426"/><stop offset="1" stop-color="#24304f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#293451"/><stop offset="1" stop-color="#1a2239"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="110" r="240" fill="#d99b73" opacity=".10"/>
  <circle cx="180" cy="820" r="300" fill="#7ac7c4" opacity=".08"/>
  <text x="130" y="140" fill="#f4f1ea" font-family="Arial, sans-serif" font-size="54" font-weight="700">AI ACTIVITY IS NOT ROI</text>
  <text x="132" y="195" fill="#abb8d4" font-family="Arial, sans-serif" font-size="26">Use vendor reports to find questions. Verify outcomes independently.</text>
  <g filter="url(#shadow)">
    <rect x="130" y="260" width="820" height="500" rx="28" fill="url(#card)" stroke="#53627f"/>
    <rect x="990" y="260" width="480" height="500" rx="28" fill="#f3efe7"/>
  </g>
  <text x="180" y="325" fill="#f4f1ea" font-family="Arial, sans-serif" font-size="30" font-weight="700">Vendor report</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#c9d2e7">
    <text x="180" y="390">Usage and spend</text><text x="180" y="485">Workstreams</text><text x="180" y="580">Reported friction</text><text x="180" y="675">Employee survey</text>
  </g>
  <g fill="#d99b73"><rect x="470" y="365" width="360" height="32" rx="16"/><rect x="470" y="460" width="275" height="32" rx="16" opacity=".8"/><rect x="470" y="555" width="205" height="32" rx="16" opacity=".65"/><rect x="470" y="650" width="320" height="32" rx="16" opacity=".9"/></g>
  <path d="M920 510 C980 510 970 510 1015 510" stroke="#7ac7c4" stroke-width="10" fill="none"/>
  <path d="M1005 488 L1035 510 L1005 532" stroke="#7ac7c4" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1045" y="325" fill="#25304a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Independent check</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#25304a">
    <circle cx="1080" cy="400" r="16" fill="#2b8a78"/><path d="M1072 400l7 7 13-18" stroke="white" stroke-width="5" fill="none"/>
    <text x="1120" y="408">Accepted output</text>
    <circle cx="1080" cy="485" r="16" fill="#2b8a78"/><path d="M1072 485l7 7 13-18" stroke="white" stroke-width="5" fill="none"/>
    <text x="1120" y="493">Review and rework</text>
    <circle cx="1080" cy="570" r="16" fill="#2b8a78"/><path d="M1072 570l7 7 13-18" stroke="white" stroke-width="5" fill="none"/>
    <text x="1120" y="578">Cycle time</text>
    <circle cx="1080" cy="655" r="16" fill="#2b8a78"/><path d="M1072 655l7 7 13-18" stroke="white" stroke-width="5" fill="none"/>
    <text x="1120" y="663">Business result</text>
  </g>
</svg>