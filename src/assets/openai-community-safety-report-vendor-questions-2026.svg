<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI safety evidence and escalation chain</title>
  <desc id="desc">A signal moves through detection, human review, escalation, and reporting, with an evidence gap highlighted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10182f"/><stop offset="1" stop-color="#272447"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a65"/><stop offset="1" stop-color="#d94f7c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="80" r="260" fill="#ff8a65" opacity=".08"/>
  <circle cx="120" cy="850" r="300" fill="#63d7c6" opacity=".07"/>
  <text x="110" y="130" fill="#f7f3ed" font-family="Arial, sans-serif" font-size="52" font-weight="700">SAFETY CLAIMS NEED EVIDENCE</text>
  <text x="112" y="182" fill="#bec9df" font-family="Arial, sans-serif" font-size="25">A referral count is a signal—not an assurance result.</text>
  <g filter="url(#shadow)">
    <rect x="100" y="300" width="285" height="300" rx="28" fill="url(#signal)"/>
    <rect x="460" y="300" width="285" height="300" rx="28" fill="#f5f1ea"/>
    <rect x="820" y="300" width="285" height="300" rx="28" fill="#f5f1ea"/>
    <rect x="1180" y="300" width="320" height="300" rx="28" fill="#f5f1ea"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="242" y="390" fill="white" font-size="31" font-weight="700">DETECTION</text><text x="242" y="455" fill="#ffe4dc" font-size="22">What was flagged?</text><text x="242" y="500" fill="#ffe4dc" font-size="22">At what error rate?</text>
    <text x="602" y="390" fill="#202943" font-size="31" font-weight="700">REVIEW</text><text x="602" y="455" fill="#536078" font-size="22">Who decided?</text><text x="602" y="500" fill="#536078" font-size="22">What evidence?</text>
    <text x="962" y="390" fill="#202943" font-size="31" font-weight="700">ESCALATION</text><text x="962" y="455" fill="#536078" font-size="22">Which threshold?</text><text x="962" y="500" fill="#536078" font-size="22">Which outcome?</text>
    <text x="1340" y="390" fill="#202943" font-size="31" font-weight="700">REPORTING</text><text x="1340" y="455" fill="#536078" font-size="22">Denominators</text><text x="1340" y="500" fill="#536078" font-size="22">Errors · appeals</text>
  </g>
  <g stroke="#63d7c6" stroke-width="9" fill="none"><path d="M385 450h55"/><path d="M425 430l22 20-22 20"/><path d="M745 450h55"/><path d="M785 430l22 20-22 20"/><path d="M1105 450h55"/><path d="M1145 430l22 20-22 20"/></g>
  <text x="800" y="750" fill="#f7f3ed" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">ASK FOR THE FULL INCIDENT CHAIN</text>
</svg>