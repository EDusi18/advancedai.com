<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">API credit pilot budget</title>
  <desc id="desc">A capped credit meter allocates a business API pilot budget across measurable workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#14364a"/></linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45d6b2"/><stop offset="1" stop-color="#8be8d2"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="120" r="260" fill="#2a6680" opacity=".18"/>
  <circle cx="180" cy="820" r="300" fill="#1e8b79" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="220" y="205" width="1160" height="490" rx="42" fill="#102b3b" stroke="#3b7182" stroke-width="3"/>
    <text x="290" y="305" fill="#dff7f2" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">API PILOT BUDGET</text>
    <text x="1290" y="305" text-anchor="end" fill="#8be8d2" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">$500 CAP</text>
    <rect x="290" y="360" width="1020" height="74" rx="37" fill="#07131d" stroke="#315d6e" stroke-width="2"/>
    <rect x="290" y="360" width="660" height="74" rx="37" fill="url(#meter)"/>
    <line x1="950" y1="350" x2="950" y2="445" stroke="#fff" stroke-width="4" opacity=".8"/>
    <text x="620" y="412" text-anchor="middle" fill="#08201f" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">MEASURED TEST</text>
    <text x="1130" y="412" text-anchor="middle" fill="#94adba" font-family="Arial, Helvetica, sans-serif" font-size="28">UNALLOCATED</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="27">
      <rect x="290" y="505" width="290" height="92" rx="18" fill="#183d4f"/><text x="435" y="560" text-anchor="middle" fill="#dff7f2">Accepted output</text>
      <rect x="655" y="505" width="290" height="92" rx="18" fill="#183d4f"/><text x="800" y="560" text-anchor="middle" fill="#dff7f2">Review time</text>
      <rect x="1020" y="505" width="290" height="92" rx="18" fill="#183d4f"/><text x="1165" y="560" text-anchor="middle" fill="#dff7f2">Post-grant cost</text>
    </g>
  </g>
  <text x="800" y="790" text-anchor="middle" fill="#88a9b6" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="3">INCLUDED CREDIT IS A TEST BUDGET, NOT A BUSINESS CASE</text>
</svg>