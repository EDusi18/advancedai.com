<text x="800" y="120" text-anchor="middle" fill="#e8f7ff" font-family="Arial, sans-serif" font-size="52" font-weight="700">LOCKDOWN MODE</text>
<text x="800" y="850" text-anchor="middle" fill="#8fb9d3" font-family="Arial, sans-serif" font-size="30">Reduce outbound risk • preserve deliberate access</text>
