<g filter="url(#glow)"><path d="M800 205 L1010 295 V475 C1010 625 925 732 800 785 C675 732 590 625 590 475 V295 Z" fill="url(#shield)" opacity=".95"/><path d="M800 300 L914 350 V472 C914 557 872 622 800 664 C728 622 686 557 686 472 V350 Z" fill="#071426" opacity=".88"/><path d="M745 470 L788 514 L870 415" fill="none" stroke="#b8f6ff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></g>
