<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">OpenAI Lockdown Mode security controls</title>
<desc id="desc">A central shield blocks selected outbound AI network paths while approved internal paths remain visible.</desc>
