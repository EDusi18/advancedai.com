<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A separate stop path for AI agent workloads</title>
<desc id="desc">An AI workload passes through a central control layer connected to monitoring, shutdown, and fail-closed controls.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172554"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".32"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1340" cy="150" r="240" fill="#38bdf8" opacity=".07"/><circle cx="220" cy="790" r="260" fill="#f43f5e" opacity=".06"/>
<text x="110" y="125" fill="#f8fafc" font-family="Arial, sans-serif" font-size="55" font-weight="700">Can your AI agent actually stop?</text>
<text x="110" y="188" fill="#b9c9da" font-family="Arial, sans-serif" font-size="29">A dashboard pause is not an enforced shutdown path</text>
<g filter="url(#shadow)"><rect x="110" y="325" width="320" height="190" rx="28" fill="#13263d" stroke="#38bdf8" stroke-width="3"/><text x="270" y="400" text-anchor="middle" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">AGENT JOB</text><text x="270" y="450" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="23">model + tools + queue</text></g>
<path d="M430 420H610" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round"/><path d="M585 397l35 23-35 23" fill="none" stroke="#7dd3fc" stroke-width="8"/>
<g filter="url(#shadow)"><rect x="620" y="285" width="390" height="270" rx="32" fill="#122d35" stroke="#22c55e" stroke-width="4"/><text x="815" y="365" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="32" font-weight="700">CONTROL LAYER</text><text x="815" y="420" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="23">job identity • authorization</text><text x="815" y="465" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="23">stop enforcement • evidence</text><text x="815" y="512" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="21">fail closed when unavailable</text></g>
<path d="M1010 420H1190" stroke="#86efac" stroke-width="8" stroke-linecap="round"/><path d="M1165 397l35 23-35 23" fill="none" stroke="#86efac" stroke-width="8"/>
<g filter="url(#shadow)"><rect x="1200" y="325" width="290" height="190" rx="28" fill="#2b2433" stroke="#fbbf24" stroke-width="3"/><text x="1345" y="400" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="30" font-weight="700">ACTION</text><text x="1345" y="450" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="23">only if authorized</text></g>
<g filter="url(#shadow)"><rect x="250" y="650" width="330" height="125" rx="24" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/><text x="415" y="702" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="27" font-weight="700">MONITOR</text><text x="415" y="742" text-anchor="middle" fill="#ede9fe" font-family="Arial, sans-serif" font-size="20">detect + escalate</text></g>
<path d="M580 712C700 712 690 570 760 555" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-dasharray="15 12"/>
<g filter="url(#shadow)"><rect x="1015" y="650" width="330" height="125" rx="62" fill="#3b1118" stroke="#fb7185" stroke-width="4"/><circle cx="1085" cy="712" r="35" fill="#e11d48"/><rect x="1068" y="694" width="34" height="36" rx="6" fill="#fff1f2"/><text x="1210" y="705" text-anchor="middle" fill="#fecdd3" font-family="Arial, sans-serif" font-size="27" font-weight="700">STOP</text><text x="1210" y="743" text-anchor="middle" fill="#fda4af" font-family="Arial, sans-serif" font-size="20">measured + tested</text></g>
<path d="M1015 712C915 712 925 570 870 555" fill="none" stroke="#fb7185" stroke-width="6" stroke-dasharray="15 12"/>
</svg>