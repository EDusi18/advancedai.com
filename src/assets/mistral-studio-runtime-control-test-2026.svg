<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Enterprise agent runtime control map</title><desc id="desc">Five connected control layers show execution, state, approvals, traces, and recovery around a bounded AI agent.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#17374d"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#78e3d6"/><stop offset="1" stop-color="#2d8fb6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><g opacity=".16" stroke="#83bdd6" stroke-width="2"><path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/><path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/></g>
<circle cx="800" cy="450" r="142" fill="url(#core)" filter="url(#glow)"/><circle cx="800" cy="450" r="94" fill="#0a1c31" stroke="#c8fff7" stroke-width="6"/><path d="M758 414h84M758 450h84M758 486h84" stroke="#c8fff7" stroke-width="12" stroke-linecap="round"/>
<g fill="#102c43" stroke="#58c9d2" stroke-width="4"><rect x="130" y="150" width="330" height="125" rx="28"/><rect x="1140" y="150" width="330" height="125" rx="28"/><rect x="130" y="625" width="330" height="125" rx="28"/><rect x="1140" y="625" width="330" height="125" rx="28"/><rect x="635" y="95" width="330" height="115" rx="28"/></g>
<g fill="#e0fbff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle"><text x="295" y="225">EXECUTION</text><text x="1305" y="225">SESSION STATE</text><text x="295" y="700">APPROVALS</text><text x="1305" y="700">RECOVERY</text><text x="800" y="165">TRACES</text></g>
<g stroke="#66d7cf" stroke-width="5" opacity=".85"><path d="M460 235L680 365M1140 235L920 365M460 655L680 535M1140 655L920 535M800 210v98"/></g><g fill="#66d7cf"><circle cx="680" cy="365" r="10"/><circle cx="920" cy="365" r="10"/><circle cx="680" cy="535" r="10"/><circle cx="920" cy="535" r="10"/><circle cx="800" cy="308" r="10"/></g>
</svg>